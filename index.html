<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTHING // MATRIX GENERATOR</title>
  <!-- Load dot-matrix style Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #141416;
      --border: #2c2c2e;
      --text: #f1f1f1;
      --red: #D71921;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      font-family: 'DotGothic16', monospace;
      letter-spacing: 3px;
      font-size: 2rem;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 span { color: var(--red); }

    .container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #a1a1a6;
    }

    input[type="range"] {
      accent-color: var(--red);
      width: 100%;
      cursor: pointer;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: var(--red);
      width: 18px;
      height: 18px;
    }

    .btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 14px;
      border-radius: 999px;
      font-family: 'DotGothic16', monospace;
      font-size: 1rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s, background 0.2s;
      text-transform: uppercase;
    }

    .btn:active { transform: scale(0.98); }
    .btn-red { background: var(--red); color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    input[type="file"] { display: none; }

    .preview-area {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      padding: 16px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      display: none;
    }

    .placeholder {
      color: #666;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>NOTHING <span>//</span> MATRIX</h1>

  <div class="container">
    <!-- Controls Sidebar -->
    <div class="controls">
      <label class="btn" for="upload">1. Upload Image</label>
      <input type="file" id="upload" accept="image/*">

      <div class="control-group">
        <label><span>Grid Density (Size)</span> <span id="gridVal">16px</span></label>
        <input type="range" id="gridSize" min="6" max="36" value="16">
      </div>

      <div class="control-group">
        <label><span>Contrast</span> <span id="contrastVal">1.2</span></label>
        <input type="range" id="contrast" min="0.5" max="2.5" step="0.1" value="1.2">
      </div>

      <div class="control-group">
        <label><span>Render Mode</span></label>
        <select id="renderMode" style="background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:8px; font-family:'JetBrains Mono'; cursor:pointer;">
          <option value="halftone">Halftone Variable Dot</option>
          <option value="strict">Strict LED Shaded</option>
          <option value="bayer">Bayer Matrix 1-Bit Dither</option>
        </select>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="redAccent" checked>
        Enable Nothing Red Highlights
      </label>

      <button class="btn btn-red" id="downloadBtn" disabled>2. Download PNG</button>
    </div>

    <!-- Canvas Output -->
    <div class="preview-area">
      <div class="placeholder" id="placeholder">Upload any image to render the dot-matrix effect</div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gridSizeInput = document.getElementById('gridSize');
    const contrastInput = document.getElementById('contrast');
    const renderModeInput = document.getElementById('renderMode');
    const redAccentInput = document.getElementById('redAccent');
    const downloadBtn = document.getElementById('downloadBtn');
    const placeholder = document.getElementById('placeholder');

    let sourceImage = new Image();
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    // 4x4 Bayer Matrix Threshold Map (normalized 0 to 1)
    const bayerMatrix4x4 = [
      [ 1/17,  9/17,  3/17, 11/17],
      [13/17,  5/17, 15/17,  7/17],
      [ 4/17, 12/17,  2/17, 10/17],
      [16/17,  8/17, 14/17,  6/17]
    ];

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        sourceImage = new Image();
        sourceImage.onload = () => {
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          downloadBtn.disabled = false;
          renderMatrix();
        };
        sourceImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    [gridSizeInput, contrastInput, renderModeInput, redAccentInput].forEach(el => {
      el.addEventListener('input', () => {
        document.getElementById('gridVal').textContent = gridSizeInput.value + 'px';
        document.getElementById('contrastVal').textContent = contrastInput.value;
        if (sourceImage.src) renderMatrix();
      });
    });

    function renderMatrix() {
      const cellSize = parseInt(gridSizeInput.value, 10);
      const contrast = parseFloat(contrastInput.value);
      const mode = renderModeInput.value;
      const useRed = redAccentInput.checked;

      // Cap max dimension for fast smooth calculation
      const scale = Math.min(1, 1400 / sourceImage.width);
      const width = Math.floor(sourceImage.width * scale);
      const height = Math.floor(sourceImage.height * scale);

      canvas.width = offscreen.width = width;
      canvas.height = offscreen.height = height;

      offCtx.drawImage(sourceImage, 0, 0, width, height);
      const imgData = offCtx.getImageData(0, 0, width, height).data;

      // Pitch Black Background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const maxRadius = (cellSize / 2) * 0.85;

      for (let y = 0; y < height; y += cellSize) {
        for (let x = 0; x < width; x += cellSize) {
          const sampleX = Math.min(width - 1, Math.floor(x + cellSize / 2));
          const sampleY = Math.min(height - 1, Math.floor(y + cellSize / 2));
          const idx = (sampleY * width + sampleX) * 4;

          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          // Calculate Luminance & apply contrast
          let luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          luma = Math.min(1, Math.max(0, (luma - 0.5) * contrast + 0.5));

          const centerX = x + cellSize / 2;
          const centerY = y + cellSize / 2;

          // Check if it's a distinct warm red tone for Nothing Red highlight
          const isRed = useRed && (r > 155 && r > g * 1.8 && r > b * 1.8);

          ctx.beginPath();
          if (isRed) {
            ctx.fillStyle = '#D71921';
            ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
          } else if (mode === 'bayer') {
            // Bayer Dither: fixed dot size, visibility mapped via 4x4 threshold matrix coordinate lookups
            const matrixX = Math.floor(x / cellSize) % 4;
            const matrixY = Math.floor(y / cellSize) % 4;
            const threshold = bayerMatrix4x4[matrixY][matrixX];

            if (luma > threshold) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * 0.9, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#111113'; // Deep subtle off state
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else if (mode === 'strict') {
            // Quantized steps
            if (luma > 0.65) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
            } else if (luma > 0.3) {
              ctx.fillStyle = '#68686E';
              ctx.arc(centerX, centerY, maxRadius * 0.8, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else {
            // Halftone Variable Radius
            if (luma > 0.08) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * luma, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.25, 0, Math.PI * 2);
            }
          }
          ctx.fill();
        }
      }
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `nothing-matrix-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
