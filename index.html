<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nothing Matrix Studio</title>

  <!-- Web App Wrapper Settings -->
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matrix">

  <!-- Browser Tab Favicon & App Manifest -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" id="appleIcon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Load Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070709;
      --glass-bg: rgba(24, 24, 28, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-muted: #98989f;
      --accent: #D71921;
      --accent-glow: rgba(215, 25, 33, 0.45);
    }

    /* Pink Theme Override */
    body.theme-pink {
      --accent: #FF2E93;
      --accent-glow: rgba(255, 46, 147, 0.45);
    }

    /* Load your uploaded custom .otf font from GitHub */
    @font-face {
      font-family: 'NothingTitle';
      src: url('./nothing.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    /* Ambient Glowing Orbs (Both use active theme accent, no blue glow) */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.42;
      background: var(--accent);
      transition: background 0.35s ease;
    }
    .glow-1 { width: 440px; height: 440px; top: -110px; left: -90px; }
    .glow-2 { width: 480px; height: 480px; bottom: -150px; right: -100px; opacity: 0.32; }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    .title-group h1 {
      font-family: 'NothingTitle', monospace;
      letter-spacing: 3px;
      font-size: 2rem;
      font-weight: 400;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .title-group h1 span {
      color: var(--accent);
      transition: color 0.25s ease;
    }

    .title-group p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1180px;
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .controls {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      height: fit-content;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-weight: 500;
    }

    .control-group label span:last-child {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Theme Pill Switcher */
    .theme-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    .theme-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .theme-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .dot-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    select {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--glass-border);
      padding: 11px 12px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    select option { background: #18181b; color: var(--text); }

    input[type="range"] {
      accent-color: var(--accent);
      width: 100%;
      cursor: pointer;
      height: 6px;
      border-radius: 999px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      padding: 4px 0;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn {
      background: var(--text);
      color: #000;
      border: none;
      padding: 14px 18px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-accent {
      background: var(--accent);
      color: white;
    }

    .btn-accent:hover:not(:disabled) {
      box-shadow: 0 6px 24px var(--accent-glow);
    }

    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    input[type="file"] { display: none; }

    .preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 520px;
      padding: 24px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 76vh;
      border-radius: 14px;
      display: none;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <header>
    <img src="./icon.svg" alt="App Logo" class="brand-icon">
    <div class="title-group">
      <h1>NOTHING <span>//</span> MATRIX</h1>
      <p>Dot-Matrix & Color Halftone Image Processor</p>
    </div>
  </header>

  <div class="container">
    <div class="controls glass-panel">
      <!-- Theme Color Switcher -->
      <div class="control-group">
        <label><span>Theme Accent</span></label>
        <div class="theme-switcher">
          <button type="button" class="theme-btn active" id="redThemeBtn">
            <span class="dot-swatch" style="background:#D71921;"></span> Nothing Red
          </button>
          <button type="button" class="theme-btn" id="pinkThemeBtn">
            <span class="dot-swatch" style="background:#FF2E93;"></span> Cyber Pink
          </button>
        </div>
      </div>

      <label class="btn" for="upload">Upload Image</label>
      <input type="file" id="upload" accept="image/*">

      <div class="control-group">
        <label><span>Effect Style</span></label>
        <select id="renderMode">
          <option value="colorOverlay">Color Matrix Overlay (Wallpaper Look)</option>
          <option value="halftone">Classic Monochrome Halftone</option>
          <option value="strict">Strict LED Matrix</option>
          <option value="bayer">Bayer 1-Bit Retro Dither</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Grid Spacing</span> <span id="gridVal">14px</span></label>
        <input type="range" id="gridSize" min="6" max="36" value="14">
      </div>

      <div class="control-group">
        <label><span>Dot Scale / Intensity</span> <span id="dotScaleVal">45%</span></label>
        <input type="range" id="dotScale" min="15" max="95" value="45">
      </div>

      <div class="control-group">
        <label><span>Contrast</span> <span id="contrastVal">1.1</span></label>
        <input type="range" id="contrast" min="0.5" max="2.5" step="0.1" value="1.1">
      </div>

      <div class="control-group">
        <label><span>Image Smooth Blur</span> <span id="blurVal">0px</span></label>
        <input type="range" id="bgBlur" min="0" max="24" value="0">
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="redAccent" checked>
        <span id="accentLabelText">Enable Nothing Accent Highlights</span>
      </label>

      <button class="btn btn-accent" id="downloadBtn" disabled>Download PNG</button>
    </div>

    <div class="preview-area glass-panel">
      <div class="placeholder" id="placeholder">Select an image to apply the dot-matrix effect</div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gridSizeInput = document.getElementById('gridSize');
    const dotScaleInput = document.getElementById('dotScale');
    const contrastInput = document.getElementById('contrast');
    const bgBlurInput = document.getElementById('bgBlur');
    const renderModeInput = document.getElementById('renderMode');
    const redAccentInput = document.getElementById('redAccent');
    const downloadBtn = document.getElementById('downloadBtn');
    const placeholder = document.getElementById('placeholder');
    const redThemeBtn = document.getElementById('redThemeBtn');
    const pinkThemeBtn = document.getElementById('pinkThemeBtn');

    let currentAccentHex = '#D71921';
    let sourceImage = new Image();
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    const bayerMatrix4x4 = [
      [ 1/17,  9/17,  3/17, 11/17],
      [13/17,  5/17, 15/17,  7/17],
      [ 4/17, 12/17,  2/17, 10/17],
      [16/17,  8/17, 14/17,  6/17]
    ];

    // Theme Switching Logic
    redThemeBtn.addEventListener('click', () => {
      document.body.classList.remove('theme-pink');
      redThemeBtn.classList.add('active');
      pinkThemeBtn.classList.remove('active');
      currentAccentHex = '#D71921';
      if (sourceImage.src) renderMatrix();
    });

    pinkThemeBtn.addEventListener('click', () => {
      document.body.classList.add('theme-pink');
      pinkThemeBtn.classList.add('active');
      redThemeBtn.classList.remove('active');
      currentAccentHex = '#FF2E93';
      if (sourceImage.src) renderMatrix();
    });

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        sourceImage = new Image();
        sourceImage.onload = () => {
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          downloadBtn.disabled = false;
          renderMatrix();
        };
        sourceImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    [gridSizeInput, dotScaleInput, contrastInput, bgBlurInput, renderModeInput, redAccentInput].forEach(el => {
      el.addEventListener('input', () => {
        document.getElementById('gridVal').textContent = gridSizeInput.value + 'px';
        document.getElementById('dotScaleVal').textContent = dotScaleInput.value + '%';
        document.getElementById('contrastVal').textContent = contrastInput.value;
        document.getElementById('blurVal').textContent = bgBlurInput.value + 'px';
        if (sourceImage.src) renderMatrix();
      });
    });

    function renderMatrix() {
      const cellSize = parseInt(gridSizeInput.value, 10);
      const dotScale = parseInt(dotScaleInput.value, 10) / 100;
      const contrast = parseFloat(contrastInput.value);
      const blurAmount = parseInt(bgBlurInput.value, 10);
      const mode = renderModeInput.value;
      const useAccent = redAccentInput.checked;

      const scale = Math.min(1, 1600 / sourceImage.width);
      const width = Math.floor(sourceImage.width * scale);
      const height = Math.floor(sourceImage.height * scale);

      canvas.width = offscreen.width = width;
      canvas.height = offscreen.height = height;

      offCtx.filter = blurAmount > 0 ? `blur(${blurAmount}px)` : 'none';
      offCtx.drawImage(sourceImage, 0, 0, width, height);
      offCtx.filter = 'none';
      const imgData = offCtx.getImageData(0, 0, width, height).data;

      if (mode === 'colorOverlay') {
        ctx.drawImage(offscreen, 0, 0);
        const radius = (cellSize / 2) * dotScale;

        for (let y = 0; y < height; y += cellSize) {
          for (let x = 0; x < width; x += cellSize) {
            const sampleX = Math.min(width - 1, Math.floor(x + cellSize / 2));
            const sampleY = Math.min(height - 1, Math.floor(y + cellSize / 2));
            const idx = (sampleY * width + sampleX) * 4;

            const r = imgData[idx];
            const g = imgData[idx + 1];
            const b = imgData[idx + 2];

            const darkenFactor = 0.55 / contrast;
            const dotR = Math.max(0, Math.floor(r * darkenFactor));
            const dotG = Math.max(0, Math.floor(g * darkenFactor));
            const dotB = Math.max(0, Math.floor(b * darkenFactor));

            ctx.beginPath();
            ctx.fillStyle = `rgba(${dotR}, ${dotG}, ${dotB}, 0.55)`;
            ctx.arc(x + cellSize / 2, y + cellSize / 2, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        return;
      }

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const maxRadius = (cellSize / 2) * (dotScale * 1.6);

      for (let y = 0; y < height; y += cellSize) {
        for (let x = 0; x < width; x += cellSize) {
          const sampleX = Math.min(width - 1, Math.floor(x + cellSize / 2));
          const sampleY = Math.min(height - 1, Math.floor(y + cellSize / 2));
          const idx = (sampleY * width + sampleX) * 4;

          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          let luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          luma = Math.min(1, Math.max(0, (luma - 0.5) * contrast + 0.5));

          const centerX = x + cellSize / 2;
          const centerY = y + cellSize / 2;
          const isWarmHighlight = useAccent && (r > 155 && r > g * 1.6 && r > b * 1.4);

          ctx.beginPath();
          if (isWarmHighlight) {
            ctx.fillStyle = currentAccentHex; // Uses Nothing Red or Cyber Pink!
            ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
          } else if (mode === 'bayer') {
            const matrixX = Math.floor(x / cellSize) % 4;
            const matrixY = Math.floor(y / cellSize) % 4;
            const threshold = bayerMatrix4x4[matrixY][matrixX];

            if (luma > threshold) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * 0.9, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#111113';
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else if (mode === 'strict') {
            if (luma > 0.65) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
            } else if (luma > 0.3) {
              ctx.fillStyle = '#68686E';
              ctx.arc(centerX, centerY, maxRadius * 0.8, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else {
            if (luma > 0.08) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * luma, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.25, 0, Math.PI * 2);
            }
          }
          ctx.fill();
        }
      }
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `nothing-matrix-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Convert icon.svg to PNG for iOS Home Screen support
    const iconImg = new Image();
    iconImg.src = './icon.svg';
    iconImg.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      c.getContext('2d').drawImage(iconImg, 0, 0, 512, 512);
      document.getElementById('appleIcon').href = c.toDataURL('image/png');
    };
  </script>
</body>
</html>
