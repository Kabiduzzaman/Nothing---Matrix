<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing Matrix Studio</title>
  <!-- Load Inter and DotGothic16 from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070709;
      --glass-bg: rgba(24, 24, 28, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-muted: #98989f;
      --red: #D71921;
      --accent-blue: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glowing Orbs for Gaussian Blur Glassmorphism */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.45;
    }
    .glow-1 {
      width: 420px; height: 420px;
      background: var(--red);
      top: -100px; left: -80px;
    }
    .glow-2 {
      width: 500px; height: 500px;
      background: var(--black);
      bottom: -150px; right: -100px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

        
    @font-face {
      font-family: 'NothingTitle';
      src: url('./nothing.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Step B: Apply it ONLY to the "NOTHING // MATRIX" title (h1) */
    h1 {
      font-family: 'NothingTitle', monospace; /* <-- Changed from DotGothic16 to NothingTitle */
      letter-spacing: 3px;
      font-size: 2.2rem;
      font-weight: 400;
      text-transform: uppercase;
      margin-bottom: 6px;
    }


    h1 span { color: var(--red); }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1180px;
    }

    @media (max-width: 820px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Frosted Glass UI Panels (Gaussian Blur) */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .controls {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      height: fit-content;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-weight: 500;
    }

    .control-group label span:last-child {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    select {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--glass-border);
      padding: 11px 12px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    select option {
      background: #18181b;
      color: var(--text);
    }

    input[type="range"] {
      accent-color: var(--red);
      width: 100%;
      cursor: pointer;
      height: 6px;
      border-radius: 999px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      padding: 4px 0;
    }

    input[type="checkbox"] {
      accent-color: var(--red);
      width: 18px;
      height: 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn {
      background: var(--text);
      color: #000;
      border: none;
      padding: 14px 18px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
    }

    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-red {
      background: var(--red);
      color: white;
    }

    .btn-red:hover:not(:disabled) {
      box-shadow: 0 6px 24px rgba(215, 25, 33, 0.4);
    }

    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    input[type="file"] { display: none; }

    .preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 520px;
      padding: 24px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 76vh;
      border-radius: 14px;
      display: none;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Ambient background blobs for Frosted Glass UI -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <header>
    <h1>NOTHING <span>//</span> MATRIX</h1>
    <p>Dot-Matrix & Color Halftone Image Processor</p>
  </header>

  <div class="container">
    <!-- Controls Sidebar -->
    <div class="controls glass-panel">
      <label class="btn" for="upload">Upload Image</label>
      <input type="file" id="upload" accept="image/*">

      <div class="control-group">
        <label><span>Effect Style</span></label>
        <select id="renderMode">
          <option value="colorOverlay">Color Matrix Overlay (Wallpaper Look)</option>
          <option value="halftone">Classic Monochrome Halftone</option>
          <option value="strict">Strict LED Matrix</option>
          <option value="bayer">Bayer 1-Bit Retro Dither</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>Grid Spacing</span> <span id="gridVal">14px</span></label>
        <input type="range" id="gridSize" min="6" max="36" value="14">
      </div>

      <div class="control-group">
        <label><span>Dot Scale / Intensity</span> <span id="dotScaleVal">45%</span></label>
        <input type="range" id="dotScale" min="15" max="95" value="45">
      </div>

      <div class="control-group">
        <label><span>Contrast</span> <span id="contrastVal">1.1</span></label>
        <input type="range" id="contrast" min="0.5" max="2.5" step="0.1" value="1.1">
      </div>

      <div class="control-group">
        <label><span>Image Smooth Blur</span> <span id="blurVal">0px</span></label>
        <input type="range" id="bgBlur" min="0" max="24" value="0">
      </div>

      <label class="checkbox-row" id="redAccentRow">
        <input type="checkbox" id="redAccent" checked>
        Enable Nothing Red Accents
      </label>

      <button class="btn btn-red" id="downloadBtn" disabled>Download PNG</button>
    </div>

    <!-- Canvas Output -->
    <div class="preview-area glass-panel">
      <div class="placeholder" id="placeholder">Select an image to apply the dot-matrix effect</div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gridSizeInput = document.getElementById('gridSize');
    const dotScaleInput = document.getElementById('dotScale');
    const contrastInput = document.getElementById('contrast');
    const bgBlurInput = document.getElementById('bgBlur');
    const renderModeInput = document.getElementById('renderMode');
    const redAccentInput = document.getElementById('redAccent');
    const downloadBtn = document.getElementById('downloadBtn');
    const placeholder = document.getElementById('placeholder');

    let sourceImage = new Image();
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    const bayerMatrix4x4 = [
      [ 1/17,  9/17,  3/17, 11/17],
      [13/17,  5/17, 15/17,  7/17],
      [ 4/17, 12/17,  2/17, 10/17],
      [16/17,  8/17, 14/17,  6/17]
    ];

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        sourceImage = new Image();
        sourceImage.onload = () => {
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          downloadBtn.disabled = false;
          renderMatrix();
        };
        sourceImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    [gridSizeInput, dotScaleInput, contrastInput, bgBlurInput, renderModeInput, redAccentInput].forEach(el => {
      el.addEventListener('input', () => {
        document.getElementById('gridVal').textContent = gridSizeInput.value + 'px';
        document.getElementById('dotScaleVal').textContent = dotScaleInput.value + '%';
        document.getElementById('contrastVal').textContent = contrastInput.value;
        document.getElementById('blurVal').textContent = bgBlurInput.value + 'px';
        if (sourceImage.src) renderMatrix();
      });
    });

    function renderMatrix() {
      const cellSize = parseInt(gridSizeInput.value, 10);
      const dotScale = parseInt(dotScaleInput.value, 10) / 100;
      const contrast = parseFloat(contrastInput.value);
      const blurAmount = parseInt(bgBlurInput.value, 10);
      const mode = renderModeInput.value;
      const useRed = redAccentInput.checked;

      const scale = Math.min(1, 1600 / sourceImage.width);
      const width = Math.floor(sourceImage.width * scale);
      const height = Math.floor(sourceImage.height * scale);

      canvas.width = offscreen.width = width;
      canvas.height = offscreen.height = height;

      // Apply optional Gaussian Blur to the source image
      offCtx.filter = blurAmount > 0 ? `blur(${blurAmount}px)` : 'none';
      offCtx.drawImage(sourceImage, 0, 0, width, height);
      offCtx.filter = 'none';
      const imgData = offCtx.getImageData(0, 0, width, height).data;

      if (mode === 'colorOverlay') {
        // 1. Draw the smooth vibrant image as the base layer
        ctx.drawImage(offscreen, 0, 0);

        // 2. Overlay uniform halftone grid dots that blend with the underlying gradient
        const radius = (cellSize / 2) * dotScale;

        for (let y = 0; y < height; y += cellSize) {
          for (let x = 0; x < width; x += cellSize) {
            const sampleX = Math.min(width - 1, Math.floor(x + cellSize / 2));
            const sampleY = Math.min(height - 1, Math.floor(y + cellSize / 2));
            const idx = (sampleY * width + sampleX) * 4;

            const r = imgData[idx];
            const g = imgData[idx + 1];
            const b = imgData[idx + 2];

            // Darken the sampled pixel color to create that subtle embedded matrix dot look
            const darkenFactor = 0.55 / contrast;
            const dotR = Math.max(0, Math.floor(r * darkenFactor));
            const dotG = Math.max(0, Math.floor(g * darkenFactor));
            const dotB = Math.max(0, Math.floor(b * darkenFactor));

            ctx.beginPath();
            ctx.fillStyle = `rgba(${dotR}, ${dotG}, ${dotB}, 0.55)`;
            ctx.arc(x + cellSize / 2, y + cellSize / 2, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        return;
      }

      // Monochrome / Classic Modes
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const maxRadius = (cellSize / 2) * (dotScale * 1.6);

      for (let y = 0; y < height; y += cellSize) {
        for (let x = 0; x < width; x += cellSize) {
          const sampleX = Math.min(width - 1, Math.floor(x + cellSize / 2));
          const sampleY = Math.min(height - 1, Math.floor(y + cellSize / 2));
          const idx = (sampleY * width + sampleX) * 4;

          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          let luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          luma = Math.min(1, Math.max(0, (luma - 0.5) * contrast + 0.5));

          const centerX = x + cellSize / 2;
          const centerY = y + cellSize / 2;
          const isRed = useRed && (r > 155 && r > g * 1.8 && r > b * 1.8);

          ctx.beginPath();
          if (isRed) {
            ctx.fillStyle = '#D71921';
            ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
          } else if (mode === 'bayer') {
            const matrixX = Math.floor(x / cellSize) % 4;
            const matrixY = Math.floor(y / cellSize) % 4;
            const threshold = bayerMatrix4x4[matrixY][matrixX];

            if (luma > threshold) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * 0.9, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#111113';
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else if (mode === 'strict') {
            if (luma > 0.65) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
            } else if (luma > 0.3) {
              ctx.fillStyle = '#68686E';
              ctx.arc(centerX, centerY, maxRadius * 0.8, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.3, 0, Math.PI * 2);
            }
          } else {
            if (luma > 0.08) {
              ctx.fillStyle = '#FFFFFF';
              ctx.arc(centerX, centerY, maxRadius * luma, 0, Math.PI * 2);
            } else {
              ctx.fillStyle = '#18181A';
              ctx.arc(centerX, centerY, maxRadius * 0.25, 0, Math.PI * 2);
            }
          }
          ctx.fill();
        }
      }
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `nothing-matrix-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
