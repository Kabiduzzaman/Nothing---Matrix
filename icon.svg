<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth Red Gradient Background -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a36"/>
      <stop offset="48%" stop-color="#D71921"/>
      <stop offset="100%" stop-color="#3b0408"/>
    </linearGradient>

    <!-- Black Dot Matrix Pattern Across the Whole Gradient -->
    <pattern id="blackDotMatrix" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3.6" fill="#0a0a0a" fill-opacity="0.52"/>
    </pattern>

    <!-- Translucent Frosted Glass Sheen -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Pill Body Dark Translucent Gradient (Ear 3a Style) -->
    <linearGradient id="pillBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232329" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#121215" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="1"/>
    </linearGradient>

    <!-- Pill Glass Rim Highlight -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Soft Drop Shadow for the Center Pill -->
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 1. Thin Outer Rectangular Frame -->
  <rect x="10" y="10" width="492" height="492" rx="108" fill="#09090b" stroke="#3f3f46" stroke-width="5"/>

  <!-- 2. Red Gradient Base -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="url(#redGradient)"/>

  <!-- 3. Black Dots Spread Across the Entire Red Gradient -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="url(#blackDotMatrix)"/>

  <!-- 4. Translucent Glass Overlay on Top of Gradient & Dots -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="url(#frostedGlass)" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"/>

  <!-- 5. 45-Degree Nothing Ear (3a) Inspired Pill in the Center -->
  <g transform="rotate(45 256 256)" filter="url(#pillShadow)">
    <!-- Outer Transparent Stem Shell -->
    <rect x="202" y="116" width="108" height="280" rx="54" fill="url(#pillBody)" stroke="url(#pillBorder)" stroke-width="3.5"/>

    <!-- Subtle Inner Chamber Line (Mimicking Nothing Transparent Casing) -->
    <rect x="212" y="126" width="88" height="260" rx="44" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

    <!-- Signature Red Dot on the Upper Part of the Pill -->
    <circle cx="256" cy="172" r="14" fill="#D71921"/>
    <!-- Subtle inner specular highlight on the red dot -->
    <circle cx="252" cy="168" r="4" fill="#ff7b82" fill-opacity="0.6"/>

    <!-- Minimal Lower Stem Branding Dot (Subtle Dark Grey Cutout) -->
    <circle cx="256" cy="336" r="6" fill="#2c2c32"/>
  </g>
</svg>

