<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Red Gradient Base -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a36"/>
      <stop offset="50%" stop-color="#D71921"/>
      <stop offset="100%" stop-color="#4a0408"/>
    </linearGradient>

    <!-- Full-Surface Dot Matrix Pattern -->
    <pattern id="dotMatrix" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="4.2" fill="#0a0a0a" fill-opacity="0.32"/>
      <circle cx="14" cy="14" r="1.8" fill="#0a0a0a" fill-opacity="0.65"/>
    </pattern>

    <!-- Translucent Frosted Glass Overlay -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Diagonal Specular Glass Glare -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Outer Rectangular Dark Frame -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0b0b0e" stroke="#3f3f46" stroke-width="14"/>

  <!-- 1. Red Gradient Inner Photo Area -->
  <rect x="46" y="46" width="420" height="420" rx="78" fill="url(#redGradient)"/>

  <!-- 2. Dots Spread Across the Whole Red Gradient -->
  <rect x="46" y="46" width="420" height="420" rx="78" fill="url(#dotMatrix)"/>

  <!-- 3. Translucent Glass Layer on Top of Gradient & Dots -->
  <rect x="46" y="46" width="420" height="420" rx="78" fill="url(#frostedGlass)" stroke="rgba(255,255,255,0.28)" stroke-width="4"/>

  <!-- 4. Top Curved Glass Reflection -->
  <rect x="50" y="50" width="412" height="200" rx="74" fill="url(#glassGlare)"/>
</svg>
